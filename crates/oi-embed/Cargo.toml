[package]
name = "oi-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedding pipelines for OpenSonarX (mock, MiniLM, CLIP)"

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers", "dep:ureq"]
reranker = ["onnx"]
arctic-m = ["onnx"]
arctic-l = ["onnx"]
clip = ["onnx", "dep:image", "dep:half"]
ollama = ["dep:ureq", "dep:serde_json"]

[dependencies]
oi-types = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

# ONNX-gated
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

# Ollama-gated
serde_json = { workspace = true, optional = true }

# CLIP-gated
image = { workspace = true, optional = true }
half = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
