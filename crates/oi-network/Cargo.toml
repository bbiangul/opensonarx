[package]
name = "oi-network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "libp2p P2P networking layer for OpenSonarX"

[dependencies]
oi-types = { workspace = true }
sha2 = { workspace = true }
oi-index = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bs58 = "0.5"
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bincode = { workspace = true }
dirs = { workspace = true }
ed25519-dalek = { workspace = true }
libp2p = { version = "0.54.1", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "kad",
    "gossipsub",
    "identify",
    "request-response",
    "mdns",
    "macros",
    "quic",
    "relay",
    "autonat",
    "dcutr",
    "upnp",
] }
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true }
