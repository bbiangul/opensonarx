[package]
name = "oi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for OpenSonarX protocol"

[features]
# onnx is default: without it the CLI silently falls back to the mock
# embedder and search results are semantically random.
default = ["onnx"]
onnx = ["oi-sdk/onnx"]
clip = ["oi-sdk/clip"]

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
oi-types = { workspace = true }
oi-sdk = { workspace = true }
oi-index = { workspace = true }
oi-network = { workspace = true }
oi-crawl = { workspace = true }
oi-staking = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bs58 = "0.5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = { workspace = true }
dirs = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
ureq = { workspace = true }
