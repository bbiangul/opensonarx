syntax = "proto3";
package opensonarx;

// ============================================================
// Wire Protocol — Tech Addendum Section 4.2
// ============================================================

// --- Query Protocol: /opensonarx/query/1.0.0 ---

message QueryRequest {
  string request_id = 1;           // UUID, generated by SDK
  bytes query_embedding = 2;       // 384 x INT8 = 384 bytes
  string query_text = 3;           // Raw query for BM25
  Filters filters = 4;
  uint32 limit = 5;                // Max results (default 5)
  bytes signed_ticket = 6;         // State channel payment ticket
  string sender_pubkey = 7;        // Solana wallet pubkey
  uint64 nonce = 8;                // Replay protection
}

message Filters {
  uint32 min_stake_usd = 1;        // Minimum stake in USD
  string freshness = 2;            // "1h", "1d", "1w", "1m", "1y"
  repeated string types = 3;       // "text", "image", "pdf"
  float min_reputation = 4;        // 0.0 - 2.0
  repeated string shards = 5;      // Force specific shards
  repeated string entities = 6;    // Entity refs filter
  repeated string content_kinds = 7; // Content kind filter ("video", "post")
  string locale = 8;               // Locale hint: "en", "pt-BR"
  string gl = 9;                   // Country/region code: "us", "br"
  string site = 10;                // Domain scope: "nytimes.com"
  string min_trust = 11;           // Min trust verdict: "trusted", "highly_trusted" (filter, not rank)
}

message QueryResponse {
  string request_id = 1;           // Echoed from request
  ResponseMeta meta = 2;
  repeated SearchResult results = 3;
  ErrorInfo error = 4;             // null if success
}

message ResponseMeta {
  uint32 latency_ms = 1;
  uint64 cost_micro_usd = 2;       // Cost in micro-USD (1500 = $0.0015)
  string shard_id = 3;             // Which shard served this
  string node_id = 4;              // Which node served this
  string model_version = 5;        // e.g., "minilm-v1"
}

message SearchResult {
  string result_id = 1;            // Unique result ID for feedback
  uint32 rank = 2;
  string title = 3;
  string url = 4;
  string snippet = 5;              // First 200 chars
  string content_md = 6;           // Full Markdown chunk
  Scores scores = 7;
  StakeInfo stake = 8;
  UtilityInfo utility = 9;
  FreshnessInfo freshness = 10;
  string extraction_quality = 11;  // "full" | "partial"
  string source = 12;              // "staked" | "external"
  string entity = 13;              // Entity ref
  string content_kind = 14;        // "video", "post", etc.
}

message Scores {
  float semantic = 1;
  float bm25 = 2;
  float final = 3;
}

message StakeInfo {
  uint64 truth = 1;                // $TRUTH amount
  uint64 usd = 2;                  // USD equivalent
  string type = 3;                 // "publisher" | "curator"
  float rep = 4;                   // Reputation multiplier
}

message UtilityInfo {
  float score = 1;                 // Agent utility score
  uint64 positive = 2;             // Positive feedback count
  uint64 negative = 3;             // Negative feedback count
}

message FreshnessInfo {
  uint64 crawled_at = 1;           // Unix timestamp of last crawl
  uint64 published_at = 2;         // Content publish date if known
  string content_hash = 3;         // SHA-256 of markdown
}

// --- Feedback Protocol: /opensonarx/feedback/1.0.0 ---

message FeedbackMessage {
  string result_id = 1;            // Which result
  bool useful = 2;                 // true = positive, false = negative
  string sender_pubkey = 3;
  bytes signature = 4;             // Ed25519 signature over (result_id + useful + nonce)
  uint64 nonce = 5;                // Replay protection
}

// --- Gossip Protocol: /opensonarx/gossip/1.0.0 ---

message GossipMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    ShardAnnounce shard_announce = 2;
    StakeEvent stake_event = 3;
    ReplicationReq replication = 4;
    ContentAnnouncement content_announcement = 5;
  }
}

message ContentAnnouncement {
  string sentinel_id = 1;        // Node that crawled it
  string url = 2;
  string domain = 3;
  string content_hash = 4;       // SHA-256 of content
  uint64 crawled_at = 5;
  uint32 chunk_count = 6;
  string shard_id = 7;           // Where it's stored
  bool is_update = 8;            // New content vs re-crawl update
  string entity = 9;             // Entity ref (e.g., "youtube.com/c/3blue1brown")
}

message Heartbeat {
  string node_id = 1;
  uint64 timestamp_ms = 2;
  uint32 shard_count = 3;          // How many shards this node serves
  uint64 vectors_stored = 4;       // Total vectors in index
  uint32 queries_served = 5;       // Since last heartbeat
  float avg_latency_ms = 6;        // Average query latency
  float uptime_pct = 7;            // 30-day rolling uptime
  uint32 min_replicas = 8;         // Node's configured min replicas per shard
}

message ShardAnnounce {
  string node_id = 1;
  repeated string shard_ids = 2;   // e.g., ["tech-prog-v1", "science-v1"]
  uint64 vector_count = 3;         // Total vectors across announced shards
  uint64 last_sync_block = 4;      // Solana slot of last registry sync
  uint32 replica_count = 5;        // Number of known replicas for this node's shards
}

message StakeEvent {
  string domain = 1;
  uint64 amount = 2;
  string tx_hash = 3;
  uint64 timestamp = 4;
  StakeAction action = 5;
  string entity = 6;                // Full entity ref (e.g., "youtube.com/c/3blue1brown")
}

enum StakeAction {
  STAKE_ACTION_UNSPECIFIED = 0;
  STAKE_ACTION_STAKE = 1;
  STAKE_ACTION_UNSTAKE = 2;
  STAKE_ACTION_SLASH = 3;
}

// --- State Channels ---

message StateChannelTicket {
  string payer_pubkey = 1;         // Agent's wallet
  string payee_pubkey = 2;         // Node's wallet
  uint64 amount_lamports = 3;      // $TRUTH amount in smallest unit
  uint64 nonce = 4;                // Monotonically increasing per channel
  bytes signature = 5;             // Ed25519 sig over (payer + payee + amount + nonce)
  uint64 expiry_slot = 6;          // Solana slot after which ticket is void
}

// --- Replication Protocol: /opensonarx/replicate/1.0.0 ---

message ReplicationReq {
  string shard_id = 1;
  uint64 from_seq = 2;
  uint32 max_chunks = 3;
}

message ReplicationResp {
  repeated DocumentChunk chunks = 1;
  uint64 latest_seq = 2;
}

message DocumentChunk {
  string chunk_id = 1;
  string url = 2;
  string content = 3;
  bytes embedding = 4;             // INT8 384 bytes
  map<string, string> metadata = 5;
  string content_hash = 6;
  uint64 seq = 7;
}

// --- Errors (Section 5.2) ---

message ErrorInfo {
  string code = 1;                 // e.g., "E1001"
  string name = 2;                 // e.g., "QUERY_TIMEOUT"
  string message = 3;              // Human-readable
  bool retryable = 4;              // true if agent should retry
  uint32 retry_after_ms = 5;       // Suggested wait before retry (0 if not retryable)
}
