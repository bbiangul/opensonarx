name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      # Pinned to the toolchain the project is developed with. `stable` moves
      # every six weeks and brings new clippy lints, so an unpinned
      # `-D warnings` fails on commits that changed nothing.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  # Optional ONNX build — runs on manual trigger or nightly
  onnx-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      # Pinned to the toolchain the project is developed with. `stable` moves
      # every six weeks and brings new clippy lints, so an unpinned
      # `-D warnings` fails on commits that changed nothing.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-onnx-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with ONNX
        run: cargo build --all-targets --features onnx

      - name: Test with ONNX
        run: cargo test --workspace --features onnx
